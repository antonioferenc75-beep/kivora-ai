<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12"><meta name="description" content="Kivora AI — chytrý AI asistent v češtině."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kivora"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/icon-192.svg">
<title>Kivora AI — tvůj AI asistent</title>
<style>
:root{color-scheme:dark;--bg:#080a12;--panel:#101421;--line:#283148;--text:#f5f7ff;--muted:#a0abc3;--purple:#a99aff;--mint:#73eed5}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 20% -10%,#2d2455 0,transparent 38%),radial-gradient(ellipse at 100% 50%,#123b3c 0,transparent 27%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;max-width:1500px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);padding:12px;gap:12px}.sidebar,.main{min-height:0;border:1px solid var(--line);border-radius:22px;background:rgba(13,17,29,.94)}.sidebar{display:flex;flex-direction:column;padding:18px;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--mint));display:grid;place-items:center;color:#080a12;font-size:22px;font-weight:900}.new{padding:12px;border-radius:12px;border:1px solid #454064;background:#1b1b32;color:white;font-weight:750}.history{display:flex;flex-direction:column;gap:5px;overflow:auto}.history button{border:1px solid transparent;border-radius:10px;padding:10px;background:transparent;color:#d7ddef;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:#1a2031}.side-note{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6}.main{display:flex;flex-direction:column;overflow:hidden}.top{height:64px;flex-shrink:0;border-bottom:1px solid #222a3d;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.status{color:#a7f2df;border:1px solid #2c514d;border-radius:99px;padding:7px 10px;font-size:11px;white-space:nowrap}.messages{flex:1;min-height:0;overflow-y:auto;padding:24px clamp(15px,5vw,70px)}.welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}.orb{width:72px;height:72px;border-radius:24px;background:linear-gradient(140deg,var(--purple),var(--mint));display:grid;place-items:center;color:#080a12;font-size:34px;font-weight:900;margin-bottom:20px}.welcome h1{font-size:clamp(32px,5vw,50px);letter-spacing:-1.7px;margin:0 0 12px}.gradient{background:linear-gradient(90deg,#c2b7ff,var(--mint));color:transparent;background-clip:text}.welcome p{max-width:480px;color:var(--muted);line-height:1.65;margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:620px;width:100%;margin-top:25px}.suggestion{border:1px solid #2b344a;border-radius:13px;background:#111726;color:#dce3f5;text-align:left;padding:13px;font-size:12px;line-height:1.5}.suggestion b{display:block;color:#fff;margin-bottom:4px}.msg{max-width:850px;margin:0 auto 22px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#24213b;color:#d2caff;font-weight:900;font-size:12px}.msg.user .avatar{background:#1a3537;color:var(--mint)}.label{font-size:11px;color:#8e9ab4;margin:0 0 7px;font-weight:750}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72;font-size:14px;color:#e7ebf7}.actions{margin-top:8px}.copy{border:1px solid #303950;background:#151b29;color:#aab5cb;border-radius:8px;padding:5px 8px;font-size:11px}.composer-wrap{padding:12px clamp(14px,5vw,70px) 15px;background:#0d111d}.composer{max-width:850px;margin:auto;border:1px solid #39435d;background:#131a29;border-radius:18px;padding:10px}.composer textarea{display:block;width:100%;min-height:48px;max-height:170px;resize:none;background:transparent;border:0;outline:none;color:#f4f6ff;padding:6px;line-height:1.5;font-size:14px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#75819c;font-size:10px}.send{width:40px;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,#b9aaff,var(--mint));color:#0a0c14;font-size:20px;font-weight:900}.send:disabled{opacity:.4}.disclaimer{text-align:center;font-size:10px;color:#6e7993;margin:8px 0 0}.toast{position:absolute;left:50%;bottom:95px;transform:translateX(-50%);background:#202a3a;border:1px solid #3b4960;border-radius:10px;padding:10px 14px;font-size:12px;display:none;max-width:90%}.toast.show{display:block}
@media(max-width:720px){.app{grid-template-columns:1fr;padding:0;gap:0}.sidebar{display:none}.main{border:0;border-radius:0}.top{height:58px;padding:0 14px}.sub{display:none}.messages{padding:18px 14px}.orb{width:62px;height:62px}.suggestions{gap:7px}.suggestion{padding:10px}.composer-wrap{padding:10px 11px calc(10px + env(safe-area-inset-bottom))}.content{font-size:13px}.msg{grid-template-columns:29px minmax(0,1fr);gap:9px}.avatar{width:29px;height:29px}}@media(max-width:350px){.suggestions{grid-template-columns:1fr}}

button:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.msg .body{min-width:0}.msg.user .content{display:inline-block;max-width:100%;background:#172b32;border:1px solid #24464b;border-radius:4px 15px 15px 15px;padding:11px 13px}.top-left{display:flex;align-items:center;gap:10px;min-width:0}.menu-toggle{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#151b29;color:#eef2ff;font-size:20px}.menu-backdrop{display:none}@media(max-width:720px){.sidebar{display:flex;position:fixed;z-index:30;inset:0 auto 0 0;width:min(84vw,320px);border-radius:0 22px 22px 0;transform:translateX(-105%);transition:transform .22s ease;box-shadow:18px 0 50px #0008}.menu-open .sidebar{transform:translateX(0)}.menu-backdrop{display:block;position:fixed;inset:0;z-index:20;background:#0009;opacity:0;pointer-events:none;transition:opacity .22s}.menu-open .menu-backdrop{opacity:1;pointer-events:auto}.top{height:64px;padding:0 13px}.menu-toggle{display:block;flex-shrink:0}.top .sub{display:none}.suggestion{min-height:74px}.send{width:44px;height:44px}.disclaimer{line-height:1.5}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* Kivora polish: smooth motion, glass panels, responsive micro-interactions */
:root{--glow:rgba(169,154,255,.16)}
body{background:radial-gradient(ellipse at 12% 0%,#30265b 0,transparent 42%),radial-gradient(ellipse at 95% 55%,#103d3c 0,transparent 32%),#080a12;background-attachment:fixed}
.sidebar,.main{background:linear-gradient(155deg,rgba(19,24,41,.96),rgba(10,14,25,.96));box-shadow:0 18px 60px #0002}
.mark,.orb{box-shadow:0 0 34px var(--glow);animation:floatGlow 5s ease-in-out infinite}
.orb{position:relative}
.orb:after{content:"";position:absolute;inset:-7px;border:1px solid #b5a8ff55;border-radius:inherit;animation:orbPulse 3s ease-out infinite}
.brand{letter-spacing:-.4px}
.new,.suggestion,.send,.menu-toggle,.status,.copy{transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}
.new:hover,.suggestion:hover{border-color:#8275c9;background:#1b2034;box-shadow:0 8px 24px #0002;transform:translateY(-2px)}
.suggestion{background:linear-gradient(145deg,#151b2b,#101522)}
.send:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 5px 22px #8ddecf35}
.send:active,.new:active,.suggestion:active{transform:scale(.97)}
.status{background:#132522}
.messages{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#38435e transparent}
.msg{animation:messageIn .28s cubic-bezier(.2,.7,.2,1) both}
.msg.user{animation-name:userIn}
.content{white-space:pre-wrap}
.typing{display:inline-flex;align-items:center;gap:5px;color:#aeb9d2;padding:7px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:typingBounce 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
@keyframes messageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes userIn{from{opacity:0;transform:translateY(7px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-5px);opacity:1}}
@keyframes floatGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes orbPulse{0%{transform:scale(.96);opacity:.65}100%{transform:scale(1.18);opacity:0}}
.composer{transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#8d83d1;box-shadow:0 0 0 3px #a99aff12,0 10px 35px #0002}
textarea::placeholder{color:#7e8aa5}
.avatar{flex-shrink:0}
@media(max-width:720px){.app{background:radial-gradient(ellipse at 50% -20%,#28204c 0,transparent 45%),#080a12}.main{background:rgba(10,14,25,.88)}.top{backdrop-filter:blur(16px);background:#0c101bd9}.composer-wrap{background:linear-gradient(180deg,#0d111d,#090c15)}.suggestion:hover{transform:none}.orb{margin-bottom:16px}.welcome h1{letter-spacing:-1.2px}}
@media(prefers-reduced-motion:reduce){.mark,.orb,.orb:after,.msg,.typing i{animation:none!important}}

.content h1,.content h2,.content h3{line-height:1.3;margin:16px 0 8px;color:#f5f7ff}.content h1{font-size:1.35em}.content h2{font-size:1.2em}.content h3{font-size:1.08em}.content strong{color:#fff;font-weight:750}.content ul{padding-left:22px;margin:7px 0}.content li{padding:2px 0}.inline-code{font-family:ui-monospace,Consolas,monospace;background:#20283a;border:1px solid #303b53;border-radius:5px;padding:2px 5px;color:#b9f4e6;font-size:.92em}.code-block{margin:12px 0;border:1px solid #303a52;border-radius:12px;overflow:auto;background:#090d16;white-space:pre}.code-block .code-head{padding:7px 11px;background:#151c2b;border-bottom:1px solid #303a52;color:#9faac2;font:10px system-ui,sans-serif;letter-spacing:.08em}.code-block code{display:block;padding:13px;color:#d8e7ff;font:12px/1.65 ui-monospace,Consolas,monospace;white-space:pre;overflow-wrap:normal}
</style></head>
<body><div class="menu-backdrop" id="menuBackdrop"></div><div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">✦</div>Kivora AI</div><button class="new" id="newChat">＋ Nová konverzace</button><div class="sub">NEDÁVNÉ KONVERZACE</div><div class="history" id="history"></div><div class="side-note">Piš česky nebo jiným jazykem. Odpovědi AI si u důležitých rozhodnutí ověř.</div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Otevřít menu" aria-expanded="false">☰</button><div><strong>Kivora AI</strong><div class="sub">Tvůj osobní AI asistent</div></div></div><div class="status">✦ AI asistent</div></header><section class="messages" id="messages" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" maxlength="6000" rows="1" placeholder="Napiš Kivoře, co má udělat…" aria-label="Zpráva pro Kivora AI"></textarea><div class="bottom"><span>Enter = odeslat · Shift + Enter = nový řádek</span><button class="send" id="send" type="submit" aria-label="Odeslat">↑</button></div></form><div class="disclaimer">Kivora AI může dělat chyby. Nesdílej hesla ani citlivé osobní údaje.</div></div><div class="toast" id="toast"></div></main></div>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const STORE = "kivora_ai_conversations_v1";
let conversations = [], activeId = null, busy = false;
const welcomeHTML = '<div class="welcome"><div class="orb">✦</div><h1>Ahoj, jsem <span class="gradient">Kivora.</span></h1><p>Tvůj AI asistent pro nápady, učení, psaní, plánování i řešení problémů. Co dnes společně vymyslíme?</p><div class="suggestions"><button class="suggestion" type="button" data-prompt="Vysvětli mi jednoduše, jak funguje umělá inteligence."><b>✧ Nauč mě něco</b>Vysvětli složitou věc jednoduše.</button><button class="suggestion" type="button" data-prompt="Pomoz mi vymyslet originální projekt, který zvládnu rozjet jen s mobilem a bez rozpočtu."><b>↗ Vymysli projekt</b>Od nápadu k prvním krokům.</button><button class="suggestion" type="button" data-prompt="Napiš přirozený text na sociální sítě pro malou místní firmu."><b>✎ Pomoz mi psát</b>Texty, nápady a úpravy.</button><button class="suggestion" type="button" data-prompt="Pomoz mi rozdělit můj dnešní úkol na jednoduché kroky."><b>◎ Naplánuj mi den</b>Jasný plán bez chaosu.</button></div></div>';
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(conversations.slice(-25)))}catch(e){}}
function active(){return conversations.find(c=>c.id===activeId)}
function showWelcome(){ $("messages").innerHTML=welcomeHTML; $("messages").querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{$("prompt").value=b.dataset.prompt;resizePrompt();$("prompt").focus()}));}
function renderHistory(){ $("history").innerHTML=""; [...conversations].reverse().forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c.title||"Nová konverzace";b.addEventListener("click",()=>{activeId=c.id;renderMessages();renderHistory();closeMenu()});$("history").append(b)});}
function renderMessages(){const c=active();if(!c||!c.messages.length){showWelcome();return}$("messages").innerHTML="";c.messages.forEach(m=>appendMessage(m.role,m.content,false));$("messages").scrollTop=$("messages").scrollHeight}
function appendMessage(role,content,scroll){if(scroll===undefined)scroll=true;if($("messages").querySelector(".welcome"))$("messages").innerHTML="";const row=document.createElement("article");row.className="msg "+(role==="user"?"user":"assistant");const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"TY":"✦";const body=document.createElement("div"),label=document.createElement("div"),txt=document.createElement("div");body.className="body";label.className="label";label.textContent=role==="user"?"TY":"KIVORA AI";txt.className="content";txt.textContent=content;body.append(label,txt);if(role==="assistant"){const actions=document.createElement("div");actions.className="actions";const copy=document.createElement("button");copy.type="button";copy.className="copy";copy.textContent="Kopírovat";copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(content);toast("Zkopírováno.")}catch(e){toast("Kopírování není dostupné.")}});actions.append(copy);body.append(actions)}row.append(avatar,body);$("messages").append(row);if(scroll)$("messages").scrollTop=$("messages").scrollHeight;return row}
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function resizePrompt(){const t=$("prompt");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,170)+"px"}
function closeMenu(){document.body.classList.remove("menu-open");$("menuToggle").setAttribute("aria-expanded","false");$("menuToggle").setAttribute("aria-label","Otevřít menu")}
function newConversation(){activeId=null;showWelcome();closeMenu();$("prompt").focus()}
$("menuToggle").addEventListener("click",()=>{const open=!document.body.classList.contains("menu-open");document.body.classList.toggle("menu-open",open);$("menuToggle").setAttribute("aria-expanded",String(open));$("menuToggle").setAttribute("aria-label",open?"Zavřít menu":"Otevřít menu")});
$("menuBackdrop").addEventListener("click",closeMenu);
$("newChat").addEventListener("click",newConversation);
$("prompt").addEventListener("input",resizePrompt);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit()}});
$("chatForm").addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;const text=$("prompt").value.trim();if(!text)return;
 if(!activeId){activeId=makeId();conversations.push({id:activeId,title:text.slice(0,42),messages:[]})}
 const c=active();c.messages.push({role:"user",content:text});if(c.messages.length===1)c.title=text.slice(0,42);
 appendMessage("user",text);$("prompt").value="";resizePrompt();busy=true;$("send").disabled=true;
 const typing=appendMessage("assistant","");typing.querySelector(".content").innerHTML='<span class="typing" role="status">Přemýšlím <i></i><i></i><i></i></span>';
 renderHistory();save();
 try{
  const messages=c.messages.slice(-30).map(m=>({role:m.role==="assistant"?"model":"user",content:m.content}));
  const res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const data=await res.json().catch(()=>({error:"Server vrátil nečitelnou odpověď."}));
  if(!res.ok)throw new Error(data.error||"AI se nepodařilo odpovědět.");
  const answer=String(data.reply||"AI nevrátila odpověď.");c.messages.push({role:"assistant",content:answer});typing.remove();appendMessage("assistant",answer);save();
 }catch(err){typing.remove();appendMessage("assistant","Nepodařilo se získat odpověď. "+(err.message==="Failed to fetch"?"Web musí být nasazený na Netlify a musí mít nastavený GEMINI_API_KEY.":err.message))}
 finally{busy=false;$("send").disabled=false;$("prompt").focus();renderHistory()}
});
try{const stored=JSON.parse(localStorage.getItem(STORE)||"[]");if(Array.isArray(stored))conversations=stored}catch(e){}
renderHistory();showWelcome();
})();
</script></body></html>
